<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Определение устройства — Orbit F&amp;F</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;
    background: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #1d1f2b);
  }
  .hint { color: var(--tg-theme-hint-color, #6b7088); font-size: 14px; }
</style>
</head>
<body>
<div>
  <p id="status">Определяем устройство…</p>
  <p class="hint" id="hint">Окно закроется само через секунду.</p>
</div>
<script>
  // Страница только считывает данные устройства и отправляет их боту через Telegram
  // (Telegram.WebApp.sendData). Никуда больше данные не уходят, сервера у страницы нет.
  (async function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    var status = document.getElementById("status");
    var hint = document.getElementById("hint");
    // Открыто кнопкой клавиатуры — initData у таких мини-приложений пустой по правилам Telegram,
    // поэтому «внутри Telegram» определяем по платформе (в обычном браузере она "unknown")
    if (!tg || !tg.platform || tg.platform === "unknown") {
      status.textContent = "Откройте эту страницу кнопкой «Определить устройство» в боте Orbit F&F.";
      hint.textContent = "";
      return;
    }
    tg.ready();
    var data = {
      v: 1,
      platform: tg.platform,
      tgv: tg.version,
      ua: navigator.userAgent,
      sw: screen.width,
      sh: screen.height,
      dpr: window.devicePixelRatio,
      tp: navigator.maxTouchPoints || 0
    };
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      try {
        var h = await navigator.userAgentData.getHighEntropyValues(["model", "platform", "platformVersion"]);
        data.ch = { model: h.model || "", platform: h.platform || "", pv: h.platformVersion || "" };
      } catch (e) { /* браузер не дал подробностей — не страшно */ }
    }
    try {
      tg.sendData(JSON.stringify(data).slice(0, 4000)); // Telegram закрывает окно сам
    } catch (e) {
      status.textContent = "Не получилось отправить данные. Закройте окно и введите модель вручную.";
      hint.textContent = String(e);
    }
  })();
</script>
</body>
</html>
